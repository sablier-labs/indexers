allowBuilds:
  "@parcel/watcher": true
  bufferutil: true
  esbuild: true
  envio-cloud: false
  msgpackr-extract: true
  oxc-resolver: true
  rescript: true
  utf-8-validate: true
minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - envio
  - "envio-*"
  - sablier
  - "@sablier/*"
  - "@prb/devkit"
  # Approved Biome 2.6 compatibility fix; exempt only this release.
  - ultracite@8.1.0

onlyBuiltDependencies:
  - "@parcel/watcher"
  - bufferutil
  - esbuild
  - msgpackr-extract
  - oxc-resolver
  - rescript
  - utf-8-validate

overrides:
  # ws@7 requires utf-8-validate@^5 as an optional peer; v5 also satisfies ws@8's >=5 range.
  utf-8-validate: 5.0.10
